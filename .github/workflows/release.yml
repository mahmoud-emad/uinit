name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build binaries
      run: make dist

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
