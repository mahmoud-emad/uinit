# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # gofmt only lists the offenders, it never fails on its own.
    - name: gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "these files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: go vet
      run: go vet ./...

    # Check set lives in staticcheck.conf so this matches `make lint`.
    - name: staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

    - name: errcheck
      run: go run github.com/kisielk/errcheck@v1.20.0 ./...

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: go test -race -v ./...
